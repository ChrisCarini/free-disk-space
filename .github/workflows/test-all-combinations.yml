name: Test All Combinations
on:
  schedule:
    - cron: '15 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  free-disk-space:
    name: >-
      android: ${{ matrix.android }}; dotnet: ${{ matrix.dotnet }}; haskell: ${{ matrix.haskell }};
      large-packages: ${{ matrix.large-packages }}; docker-images: ${{ matrix.docker-images }};
      preinstalled-runtimes: ${{ matrix.preinstalled-runtimes }}; swap-storage: ${{ matrix.swap-storage }};
      tool-cache: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The deprecated tool-cache alias is covered separately by unit tests.
      matrix:
        android: ['true', 'false']
        dotnet: ['true', 'false']
        haskell: ['true', 'false']
        large-packages: ['true', 'false']
        docker-images: ['true', 'false']
        preinstalled-runtimes: ['true', 'false']
        swap-storage: ['true', 'false']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free Disk Space
        uses: ./
        with:
          android: ${{ matrix.android }}
          dotnet: ${{ matrix.dotnet }}
          haskell: ${{ matrix.haskell }}
          large-packages: ${{ matrix.large-packages }}
          docker-images: ${{ matrix.docker-images }}
          preinstalled-runtimes: ${{ matrix.preinstalled-runtimes }}
          swap-storage: ${{ matrix.swap-storage }}
          tool-cache: false
